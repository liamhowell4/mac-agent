name: Quake1
options:
  bundleIdPrefix: com.liamhowell
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  Quake1:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Quake1
    info:
      path: Quake1/Info.plist
      properties:
        CFBundleName: Quake1
        CFBundleDisplayName: Quake
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liamhowell.quake1
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # No sandbox: the app spawns the Python daemon, and the daemon controls the Mac.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
