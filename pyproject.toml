[project]
name = "tooleval"
version = "0.1.0"
description = "Local tool-calling eval harness for small models (Qwen 3.5 / Gemma 4) on macOS/MCP tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.scripts]
tooleval = "tooleval.cli:main"
quake = "quake1.cli:main"
quake-daemon = "quake1.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tooleval", "src/quake1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/tooleval/report/render.py" = ["E501"]  # inline HTML/CSS template has long lines

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
