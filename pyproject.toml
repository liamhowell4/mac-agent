[project]
name = "tooleval"
version = "0.1.0"
description = "Local tool-calling eval harness for small models (Qwen 3.5 / Gemma 4) on macOS/MCP tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.scripts]
tooleval = "tooleval.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tooleval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
